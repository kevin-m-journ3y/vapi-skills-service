<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6d28d9">
    <title>Photo link expired</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="📷 Photo upload link">
    <meta property="og:description" content="This link has expired — reply PHOTO to your site number for a fresh one.">
    <meta property="og:image" content="{{ og_image }}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="{{ og_image }}">
    <style>
        :root { --bg:#f4f5f7; --card:#fff; --text:#1a1a2e; --muted:#6b7280; --shadow:0 1px 4px rgba(0,0,0,.08); }
        @media (prefers-color-scheme: dark) { :root { --bg:#0f1117; --card:#1b1e27; --text:#f3f4f6; --muted:#9aa3b2; --shadow:0 1px 6px rgba(0,0,0,.4); } }
        * { box-sizing: border-box; }
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
               background:var(--bg); color:var(--text); min-height:100dvh; display:flex; align-items:center; justify-content:center;
               padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
        .card { background:var(--card); border-radius:18px; padding:32px 26px; max-width:380px; width:100%; text-align:center; box-shadow:var(--shadow); }
        .icon { font-size:2.8rem; }
        h1 { font-size:1.3rem; margin:10px 0 8px; }
        p { color:var(--muted); margin:0; line-height:1.5; }
        strong { color:var(--text); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⏳</div>
        <h1>This photo link has expired</h1>
        <p>Text your site number again and reply <strong>PHOTO</strong> to get a fresh upload link.</p>
    </div>
</body>
</html>
