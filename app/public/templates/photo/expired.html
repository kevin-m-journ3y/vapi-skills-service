<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link expired</title>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #f4f5f7; color: #1a1a2e; display: flex; min-height: 100vh; align-items: center; justify-content: center; }
        .card { background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 380px; margin: 16px; text-align: center;
                box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: #6b7280; margin: 0; }
        .icon { font-size: 2.6rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⏳</div>
        <h1>This photo link has expired</h1>
        <p>Text the site number again and reply <strong>PHOTO</strong> to get a fresh upload link.</p>
    </div>
</body>
</html>
