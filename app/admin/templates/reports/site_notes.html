{% extends "layouts/base.html" %}

{% block title %}Site Notes{% endblock %}

{% block content %}
<div x-data="siteNotesPage()" x-init="init()">
    <!-- Toast -->
    <div x-show="toast.show" x-transition class="toast toast-top toast-end z-50" x-cloak>
        <div class="alert" :class="toast.type === 'success' ? 'alert-success' : 'alert-error'">
            <span x-text="toast.message"></span>
        </div>
    </div>

    <!-- Page Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold">Site Notes</h1>
            <p class="text-base-content/70 mt-1">Observations, concerns and updates logged by the team</p>
        </div>
        <button class="btn btn-primary btn-sm gap-1" @click="$dispatch('open-site-note')">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            Add Note
        </button>
    </div>

    <!-- Tenant Switcher (Super Admin Only) -->
    <template x-if="currentUser?.role === 'super_admin'">
        <div class="mb-4">
            <select class="select select-bordered w-full max-w-xs" x-model="selectedTenantId" @change="onTenantChange()">
                <option value="">All Tenants</option>
                <template x-for="tenant in availableTenants" :key="tenant.id">
                    <option :value="tenant.id" x-text="tenant.name"></option>
                </template>
            </select>
        </div>
    </template>

    <!-- Filters -->
    <div class="card bg-base-100 shadow mb-4">
        <div class="card-body py-3">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="form-control">
                    <label class="label label-text text-xs">Site</label>
                    <select class="select select-bordered select-sm w-64" x-model="selectedSiteId" @change="loadNotes()">
                        <option value="">All Sites</option>
                        <template x-for="site in availableSites" :key="site.id">
                            <option :value="site.id" x-text="site.name"></option>
                        </template>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">From</label>
                    <input type="date" class="input input-bordered input-sm" x-model="startDate" @change="loadNotes()" />
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">To</label>
                    <input type="date" class="input input-bordered input-sm" x-model="endDate" @change="loadNotes()" />
                </div>
                <button class="btn btn-sm btn-ghost" @click="startDate = ''; endDate = ''; loadNotes()">Clear dates</button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Empty State -->
    <div x-show="!loading && notes.length === 0" x-cloak class="text-center py-12 text-base-content/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
        <p class="text-lg">No site notes yet</p>
        <p class="text-sm mt-1">Click "Add Note" to create the first one</p>
    </div>

    <!-- Notes Timeline -->
    <div x-show="!loading && notes.length > 0" x-cloak class="space-y-4">
        <template x-for="note in notes" :key="note.id">
            <div class="card bg-base-100 shadow">
                <div class="card-body py-4">
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-2">
                            <span class="badge badge-primary badge-sm" x-text="note.site_name"></span>
                            <span class="text-xs text-base-content/40" x-text="formatDate(note.created_at)"></span>
                        </div>
                        <span class="text-xs text-base-content/40" x-text="note.admin_users?.username || note.admin_users?.email || ''"></span>
                    </div>
                    <p class="mt-2 whitespace-pre-wrap" x-text="note.note_text"></p>

                    <!-- Attachments -->
                    <template x-if="note.attachments?.length > 0">
                        <div class="mt-3 flex flex-wrap gap-2">
                            <template x-for="(att, ai) in note.attachments" :key="ai">
                                <a :href="att.url" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 bg-base-200 rounded-lg hover:bg-base-300 transition-colors text-sm">
                                    <template x-if="att.content_type?.startsWith('image/')">
                                        <img :src="att.url" class="h-10 w-10 object-cover rounded" />
                                    </template>
                                    <template x-if="!att.content_type?.startsWith('image/')">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-base-content/50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                                    </template>
                                    <span x-text="att.filename" class="truncate max-w-[150px]"></span>
                                </a>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function siteNotesPage() {
    return {
        currentUser: null,
        availableTenants: [],
        availableSites: [],
        selectedTenantId: '',
        selectedSiteId: '',
        startDate: '',
        endDate: '',
        loading: false,
        notes: [],
        toast: { show: false, message: '', type: 'success' },

        async init() {
            try {
                const resp = await fetch('/admin/auth/me');
                if (resp.ok) {
                    const d = await resp.json();
                    this.currentUser = d.user;
                    if (this.currentUser?.tenant_id) {
                        this.selectedTenantId = this.currentUser.tenant_id;
                    }
                }
            } catch (e) {}

            if (this.currentUser?.role === 'super_admin') {
                await this.loadTenants();
            }
            if (this.selectedTenantId) {
                await this.loadSites();
            }
            await this.loadNotes();
        },

        async loadTenants() {
            try {
                const resp = await fetch('/admin/tenants/data');
                if (resp.ok) {
                    const d = await resp.json();
                    if (d.success) this.availableTenants = d.tenants || [];
                }
            } catch (e) {}
        },

        async loadSites() {
            try {
                let url = '/admin/sites/data';
                if (this.currentUser?.role === 'super_admin' && this.selectedTenantId) {
                    url += `?tenant_id=${this.selectedTenantId}`;
                }
                const resp = await fetch(url);
                if (resp.ok) {
                    const d = await resp.json();
                    if (d.success) this.availableSites = d.sites || [];
                }
            } catch (e) {}
        },

        async onTenantChange() {
            this.selectedSiteId = '';
            await this.loadSites();
            await this.loadNotes();
        },

        async loadNotes() {
            this.loading = true;
            try {
                let url = '/admin/site-notes/data?limit=100';
                if (this.selectedTenantId) url += `&tenant_id=${this.selectedTenantId}`;
                if (this.selectedSiteId) url += `&site_id=${this.selectedSiteId}`;
                if (this.startDate) url += `&start_date=${this.startDate}`;
                if (this.endDate) url += `&end_date=${this.endDate}`;

                const resp = await fetch(url);
                const d = await resp.json();
                if (d.success) {
                    this.notes = d.notes || [];
                }
            } catch (e) {
                this.showToast('Error loading notes', 'error');
            }
            this.loading = false;
        },

        formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        },

        showToast(message, type = 'success') {
            this.toast = { show: true, message, type };
            setTimeout(() => this.toast.show = false, 3000);
        }
    };
}
</script>
{% endblock %}
