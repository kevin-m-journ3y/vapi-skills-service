{% extends "layouts/base.html" %}

{% block title %}Site Notes{% endblock %}

{% block content %}
<div x-data="siteNotesPage()" x-init="init()" @site-note-saved.window="loadNotes(); loadOpenIssueCount()">
    <!-- Toast -->
    <div x-show="toast.show" x-transition class="toast toast-top toast-end z-50" x-cloak>
        <div class="alert" :class="toast.type === 'success' ? 'alert-success' : 'alert-error'">
            <span x-text="toast.message"></span>
        </div>
    </div>

    <!-- Page Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-3xl font-bold">Site Notes</h1>
            <p class="text-base-content/70 mt-1">Observations, concerns and updates logged by the team</p>
        </div>
        <button class="btn btn-primary btn-sm gap-1" @click="$dispatch('open-site-note')">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            Add Note
        </button>
    </div>

    <!-- Tenant Switcher (Super Admin Only) -->
    <template x-if="currentUser?.role === 'super_admin'">
        <div class="mb-4">
            <select class="select select-bordered w-full max-w-xs" x-model="selectedTenantId" @change="onTenantChange()">
                <option value="">All Tenants</option>
                <template x-for="tenant in availableTenants" :key="tenant.id">
                    <option :value="tenant.id" x-text="tenant.name"></option>
                </template>
            </select>
        </div>
    </template>

    <!-- Filters -->
    <div class="card bg-base-100 shadow mb-4">
        <div class="card-body py-3">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="form-control">
                    <label class="label label-text text-xs">Site</label>
                    <select class="select select-bordered select-sm w-64" x-model="selectedSiteId" @change="loadNotes()">
                        <option value="">All Sites</option>
                        <template x-for="site in availableSites" :key="site.id">
                            <option :value="site.id" x-text="site.name"></option>
                        </template>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">From</label>
                    <input type="date" class="input input-bordered input-sm" x-model="startDate" @change="loadNotes()" />
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">To</label>
                    <input type="date" class="input input-bordered input-sm" x-model="endDate" @change="loadNotes()" />
                </div>
                <button class="btn btn-sm btn-ghost" @click="startDate = ''; endDate = ''; loadNotes()">Clear dates</button>

                <!-- Issues Only toggle -->
                <label class="cursor-pointer flex items-center gap-2 ml-2">
                    <input type="checkbox" class="checkbox checkbox-warning checkbox-sm" x-model="issuesOnly" @change="loadNotes()" />
                    <span class="text-sm font-medium">Issues only</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Issue summary banner -->
    <template x-if="openIssueCount > 0">
        <div class="alert alert-warning mb-4 py-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
            <span x-text="`${openIssueCount} open issue${openIssueCount > 1 ? 's' : ''} requiring attention`"></span>
            <button class="btn btn-xs btn-warning" @click="issuesOnly = true; loadNotes()">View Issues</button>
        </div>
    </template>

    <!-- Loading -->
    <div x-show="loading" class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- Empty State -->
    <div x-show="!loading && notes.length === 0" x-cloak class="text-center py-12 text-base-content/50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
        <p class="text-lg" x-text="issuesOnly ? 'No open issues' : 'No site notes yet'"></p>
        <p class="text-sm mt-1" x-text="issuesOnly ? 'All issues have been resolved' : 'Click \"Add Note\" to create the first one'"></p>
    </div>

    <!-- Notes Timeline -->
    <div x-show="!loading && notes.length > 0" x-cloak class="space-y-3">
        <template x-for="note in notes" :key="note.id">
            <div class="card bg-base-100 shadow"
                 :class="note.is_issue && !note.is_resolved ? 'border-l-4 border-warning' : note.is_issue && note.is_resolved ? 'border-l-4 border-success' : ''">
                <div class="card-body py-4">
                    <div class="flex justify-between items-start gap-2">
                        <!-- Left: site + date + badges -->
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="badge badge-primary badge-sm" x-text="note.site_name"></span>

                            <!-- Note date (prominent) -->
                            <span class="font-medium text-sm" x-text="formatNoteDate(note.note_date)"></span>

                            <!-- Written at (if different from note_date) -->
                            <template x-if="noteDateDiffersFromCreated(note)">
                                <span class="text-xs text-base-content/40" x-text="`(logged ${formatDate(note.created_at)})`"></span>
                            </template>

                            <!-- Issue badges -->
                            <template x-if="note.is_issue && !note.is_resolved">
                                <span class="badge badge-warning badge-sm gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" /></svg>
                                    Open Issue
                                </span>
                            </template>
                            <template x-if="note.is_issue && note.is_resolved">
                                <span class="badge badge-success badge-sm gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                    Resolved
                                </span>
                            </template>
                        </div>

                        <!-- Right: author + resolve toggle -->
                        <div class="flex items-center gap-3 shrink-0">
                            <span class="text-xs text-base-content/40" x-text="note.admin_users?.username || note.admin_users?.email || ''"></span>

                            <!-- Resolve toggle (issues only) -->
                            <template x-if="note.is_issue">
                                <label class="flex items-center gap-1.5 cursor-pointer" :title="note.is_resolved ? 'Mark as open' : 'Mark as resolved'">
                                    <span class="text-xs" :class="note.is_resolved ? 'text-success' : 'text-warning'"
                                          x-text="note.is_resolved ? 'Resolved' : 'Unresolved'"></span>
                                    <input type="checkbox" class="toggle toggle-sm"
                                           :class="note.is_resolved ? 'toggle-success' : 'toggle-warning'"
                                           :checked="note.is_resolved"
                                           @change="toggleResolve(note)" />
                                </label>
                            </template>
                        </div>
                    </div>

                    <p class="mt-2 whitespace-pre-wrap" x-text="note.note_text"></p>

                    <!-- Resolved info -->
                    <template x-if="note.is_issue && note.is_resolved && note.resolved_at">
                        <p class="text-xs text-success/70 mt-1" x-text="`Resolved ${formatDate(note.resolved_at)}`"></p>
                    </template>

                    <!-- Attachments -->
                    <template x-if="note.attachments?.length > 0">
                        <div class="mt-3 flex flex-wrap gap-2">
                            <template x-for="(att, ai) in note.attachments" :key="ai">
                                <a :href="att.url" target="_blank" class="flex items-center gap-1.5 px-3 py-1.5 bg-base-200 rounded-lg hover:bg-base-300 transition-colors text-sm">
                                    <template x-if="att.content_type?.startsWith('image/')">
                                        <img :src="att.url" class="h-10 w-10 object-cover rounded" />
                                    </template>
                                    <template x-if="!att.content_type?.startsWith('image/')">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-base-content/50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" /></svg>
                                    </template>
                                    <span x-text="att.filename" class="truncate max-w-[150px]"></span>
                                </a>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</div>

<script>
function siteNotesPage() {
    return {
        currentUser: null,
        availableTenants: [],
        availableSites: [],
        selectedTenantId: '',
        selectedSiteId: '',
        startDate: '',
        endDate: '',
        issuesOnly: false,
        loading: false,
        notes: [],
        openIssueCount: 0,
        toast: { show: false, message: '', type: 'success' },

        async init() {
            try {
                const resp = await fetch('/admin/auth/me');
                if (resp.ok) {
                    const d = await resp.json();
                    this.currentUser = d.user;
                    if (this.currentUser?.tenant_id) {
                        this.selectedTenantId = this.currentUser.tenant_id;
                    }
                }
            } catch (e) {}

            if (this.currentUser?.role === 'super_admin') {
                await this.loadTenants();
            }
            if (this.selectedTenantId) {
                await this.loadSites();
            }
            await this.loadNotes();
            await this.loadOpenIssueCount();
        },

        async loadTenants() {
            try {
                const resp = await fetch('/admin/tenants/data');
                if (resp.ok) {
                    const d = await resp.json();
                    if (d.success) this.availableTenants = d.tenants || [];
                }
            } catch (e) {}
        },

        async loadSites() {
            try {
                let url = '/admin/sites/data';
                if (this.currentUser?.role === 'super_admin' && this.selectedTenantId) {
                    url += `?tenant_id=${this.selectedTenantId}`;
                }
                const resp = await fetch(url);
                if (resp.ok) {
                    const d = await resp.json();
                    if (d.success) this.availableSites = d.sites || [];
                }
            } catch (e) {}
        },

        async onTenantChange() {
            this.selectedSiteId = '';
            await this.loadSites();
            await this.loadNotes();
            await this.loadOpenIssueCount();
        },

        async loadNotes() {
            this.loading = true;
            try {
                let url = '/admin/site-notes/data?limit=100';
                if (this.selectedTenantId) url += `&tenant_id=${this.selectedTenantId}`;
                if (this.selectedSiteId) url += `&site_id=${this.selectedSiteId}`;
                if (this.startDate) url += `&start_date=${this.startDate}`;
                if (this.endDate) url += `&end_date=${this.endDate}`;
                if (this.issuesOnly) url += `&issues_only=true`;

                const resp = await fetch(url);
                const d = await resp.json();
                if (d.success) {
                    this.notes = d.notes || [];
                }
            } catch (e) {
                this.showToast('Error loading notes', 'error');
            }
            this.loading = false;
        },

        async loadOpenIssueCount() {
            try {
                let url = '/admin/site-notes/data?limit=200&issues_only=true';
                if (this.selectedTenantId) url += `&tenant_id=${this.selectedTenantId}`;
                if (this.selectedSiteId) url += `&site_id=${this.selectedSiteId}`;
                const resp = await fetch(url);
                const d = await resp.json();
                if (d.success) {
                    this.openIssueCount = (d.notes || []).filter(n => !n.is_resolved).length;
                }
            } catch (e) {}
        },

        async toggleResolve(note) {
            const newResolved = !note.is_resolved;
            try {
                const resp = await fetch(`/admin/site-notes/${note.id}/resolve`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resolved: newResolved }),
                });
                const d = await resp.json();
                if (d.success) {
                    note.is_resolved = newResolved;
                    note.resolved_at = newResolved ? new Date().toISOString() : null;
                    this.openIssueCount = this.notes.filter(n => n.is_issue && !n.is_resolved).length;
                    this.showToast(newResolved ? 'Issue marked as resolved' : 'Issue re-opened', 'success');
                } else {
                    this.showToast('Failed to update issue status', 'error');
                }
            } catch (e) {
                this.showToast('Error updating issue', 'error');
            }
        },

        formatNoteDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        },

        formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        },

        noteDateDiffersFromCreated(note) {
            if (!note.note_date || !note.created_at) return false;
            return note.note_date !== note.created_at.slice(0, 10);
        },

        showToast(message, type = 'success') {
            this.toast = { show: true, message, type };
            setTimeout(() => this.toast.show = false, 3000);
        }
    };
}
</script>
{% endblock %}
