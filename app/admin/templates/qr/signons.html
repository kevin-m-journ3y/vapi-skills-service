{% extends "layouts/base.html" %}
{% block title %}Sign-Ons{% endblock %}
{% block content %}
<div x-data="signonsReport()" x-init="init()">
    <!-- Toast -->
    <div x-show="toast.show" x-transition class="toast toast-top toast-end z-50" x-cloak>
        <div class="alert" :class="toast.type === 'success' ? 'alert-success' : 'alert-error'">
            <span x-text="toast.message"></span>
        </div>
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-4xl font-bold">Sign-Ons</h1>
            <p class="text-base-content/70 mt-2">Track sign-on activity across sites</p>
        </div>
        <button class="btn btn-outline btn-sm" @click="exportCSV()" x-show="signons.length > 0">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
            Export CSV
        </button>
    </div>

    <!-- Tenant Switcher -->
    <template x-if="currentUser?.role === 'super_admin'">
        <div class="mb-4">
            <select class="select select-bordered w-full max-w-xs" x-model="selectedTenantId" @change="selectedUserId = ''; loadUsers(); loadData()">
                <option value="">Select Tenant</option>
                <template x-for="t in tenants" :key="t.id">
                    <option :value="t.id" x-text="t.name"></option>
                </template>
            </select>
        </div>
    </template>

    <!-- Filters -->
    <div class="card bg-base-100 shadow mb-4" x-show="selectedTenantId">
        <div class="card-body py-3">
            <div class="flex flex-wrap gap-3 items-end">
                <div class="form-control">
                    <label class="label label-text text-xs">From</label>
                    <input type="date" class="input input-bordered input-sm" x-model="dateFrom" @change="loadData()" />
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">To</label>
                    <input type="date" class="input input-bordered input-sm" x-model="dateTo" @change="loadData()" />
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">Person</label>
                    <select class="select select-bordered select-sm w-44" x-model="selectedUserId" @change="loadData()">
                        <option value="">All Users</option>
                        <template x-for="u in users" :key="u.id">
                            <option :value="u.id" x-text="u.name"></option>
                        </template>
                    </select>
                </div>
                <div class="form-control">
                    <label class="label label-text text-xs">Status</label>
                    <select class="select select-bordered select-sm w-36" x-model="selectedStatus" @change="loadData()">
                        <option value="all">All</option>
                        <option value="active">Active</option>
                        <option value="signed_off">Signed Off</option>
                    </select>
                </div>
                <div class="flex gap-1">
                    <button class="btn btn-xs" @click="setPreset('today')">Today</button>
                    <button class="btn btn-xs" @click="setPreset('week')">This Week</button>
                    <button class="btn btn-xs" @click="setPreset('month')">This Month</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" x-show="selectedTenantId">
        <div class="stat bg-base-100 rounded-box shadow">
            <div class="stat-title">Total Sign-Ons</div>
            <div class="stat-value text-primary" x-text="stats.total || 0"></div>
        </div>
        <div class="stat bg-base-100 rounded-box shadow">
            <div class="stat-title">Currently Active</div>
            <div class="stat-value text-warning" x-text="stats.active || 0"></div>
        </div>
        <div class="stat bg-base-100 rounded-box shadow">
            <div class="stat-title">Signed Off</div>
            <div class="stat-value text-success" x-text="stats.signed_off || 0"></div>
        </div>
    </div>

    <!-- Table -->
    <div class="card bg-base-100 shadow-xl" x-show="selectedTenantId">
        <div class="card-body p-0">
            <div x-show="loading" class="flex justify-center py-12">
                <span class="loading loading-spinner loading-lg"></span>
            </div>

            <div x-show="!loading" class="overflow-x-auto">
                <table id="signons-table" class="table table-zebra">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Site</th>
                            <th>Signed On</th>
                            <th>Signed Off</th>
                            <th>Duration</th>
                            <th>Status</th>
                            <th>Method</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(s, idx) in signons" :key="s.id">
                            <tr>
                                <td x-text="s.user_name"></td>
                                <td x-text="s.site_name"></td>
                                <td>
                                    <div x-show="!isEditing(s.id, 'signed_on_at')" class="flex items-center gap-1">
                                        <span x-text="formatDateTime(s.signed_on_at)"></span>
                                        <button class="btn btn-ghost btn-xs px-1 opacity-40 hover:opacity-100" @click.stop="editTime(idx, 'signed_on_at')" title="Edit time">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                        </button>
                                    </div>
                                    <div x-show="isEditing(s.id, 'signed_on_at')" class="flex flex-col gap-1" x-cloak>
                                        <input type="datetime-local" class="input input-bordered input-xs w-44"
                                               :value="toLocalInput(s.signed_on_at)"
                                               @keyup.escape="editingId = null"
                                               @keyup.enter="saveTime(idx, 'signed_on_at', $event.target.value)" />
                                        <div class="flex gap-1">
                                            <button class="btn btn-success btn-xs gap-1" @click="saveTime(idx, 'signed_on_at', $el.closest('td').querySelector('input').value)">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                                Save
                                            </button>
                                            <button class="btn btn-ghost btn-xs" @click="editingId = null">Cancel</button>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div x-show="!isEditing(s.id, 'signed_off_at')" class="flex items-center gap-1">
                                        <span x-text="s.signed_off_at ? formatDateTime(s.signed_off_at) : '-'"></span>
                                        <button class="btn btn-ghost btn-xs px-1 opacity-40 hover:opacity-100" @click.stop="editTime(idx, 'signed_off_at')" title="Edit time">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                                        </button>
                                    </div>
                                    <div x-show="isEditing(s.id, 'signed_off_at')" class="flex flex-col gap-1" x-cloak>
                                        <input type="datetime-local" class="input input-bordered input-xs w-44"
                                               :value="toLocalInput(s.signed_off_at)"
                                               @keyup.escape="editingId = null"
                                               @keyup.enter="saveTime(idx, 'signed_off_at', $event.target.value)" />
                                        <div class="flex gap-1">
                                            <button class="btn btn-success btn-xs gap-1" @click="saveTime(idx, 'signed_off_at', $el.closest('td').querySelector('input').value)">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                                                Save
                                            </button>
                                            <button class="btn btn-ghost btn-xs" @click="editingId = null">Cancel</button>
                                        </div>
                                    </div>
                                </td>
                                <td x-text="calcDuration(s)"></td>
                                <td>
                                    <span class="badge badge-sm" :class="s.status === 'active' ? 'badge-warning' : 'badge-success'" x-text="s.status"></span>
                                </td>
                                <td>
                                    <span class="text-sm text-base-content/60" x-text="s.signoff_method || '-'"></span>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>

                <div x-show="signons.length === 0 && !loading" class="text-center py-12 text-base-content/50">
                    No sign-on records found for selected filters
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function signonsReport() {
    return {
        currentUser: null,
        selectedTenantId: '',
        tenants: [],
        signons: [],
        users: [],
        selectedUserId: '',
        selectedStatus: 'all',
        stats: {},
        loading: false,
        editingId: null,
        editingField: null,
        toast: { show: false, message: '', type: 'success' },
        dateFrom: new Date().toISOString().split('T')[0],
        dateTo: new Date().toISOString().split('T')[0],

        async init() {
            const resp = await fetch('/admin/auth/me', { credentials: 'same-origin' });
            if (!resp.ok) { window.location.href = '/admin/login'; return; }
            const data = await resp.json();
            this.currentUser = data.user;

            if (this.currentUser.role === 'super_admin') {
                await this.loadTenants();
            } else {
                this.selectedTenantId = this.currentUser.tenant_id;
                await Promise.all([this.loadUsers(), this.loadData()]);
            }
        },

        async loadTenants() {
            const resp = await fetch('/admin/tenants/data', { credentials: 'same-origin' });
            if (resp.ok) {
                const data = await resp.json();
                if (data.success) this.tenants = data.tenants || [];
            }
        },

        setPreset(preset) {
            const today = new Date();
            this.dateTo = today.toISOString().split('T')[0];

            if (preset === 'today') {
                this.dateFrom = today.toISOString().split('T')[0];
            } else if (preset === 'week') {
                const monday = new Date(today);
                monday.setDate(today.getDate() - today.getDay() + 1);
                this.dateFrom = monday.toISOString().split('T')[0];
            } else if (preset === 'month') {
                const first = new Date(today.getFullYear(), today.getMonth(), 1);
                this.dateFrom = first.toISOString().split('T')[0];
            }
            this.loadData();
        },

        async loadUsers() {
            if (!this.selectedTenantId) { this.users = []; return; }
            const resp = await fetch(`/admin/users/data?tenant_id=${this.selectedTenantId}`, { credentials: 'same-origin' });
            if (resp.ok) {
                const data = await resp.json();
                if (data.success) {
                    this.users = (data.users || []).sort((a, b) => a.name.localeCompare(b.name));
                }
            }
        },

        async loadData() {
            if (!this.selectedTenantId) return;
            this.loading = true;
            try {
                const params = new URLSearchParams({
                    tenant_id: this.selectedTenantId,
                    date_from: this.dateFrom,
                    date_to: this.dateTo,
                });
                if (this.selectedUserId) params.set('user_id', this.selectedUserId);
                if (this.selectedStatus !== 'all') params.set('status', this.selectedStatus);
                const resp = await fetch(`/admin/qr-signons/data?${params}`, { credentials: 'same-origin' });
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.success) {
                        this.signons = data.signons;
                        this.stats = data.stats;
                    }
                }
            } finally {
                this.loading = false;
            }
        },

        formatDateTime(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short' }) + ' ' +
                   d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: true });
        },

        calcDuration(signon) {
            if (!signon.signed_off_at) return '-';
            const start = new Date(signon.signed_on_at);
            const end = new Date(signon.signed_off_at);
            const hours = (end - start) / (1000 * 60 * 60);
            if (hours < 1) return Math.round(hours * 60) + 'm';
            return hours.toFixed(1) + 'h';
        },

        showToast(message, type = 'success') {
            this.toast = { show: true, message, type };
            setTimeout(() => { this.toast.show = false; }, 3000);
        },

        isEditing(id, field) {
            return this.editingId === id && this.editingField === field;
        },

        editTime(idx, field) {
            const s = this.signons[idx];
            this.editingId = s.id;
            this.editingField = field;
            this.$nextTick(() => {
                setTimeout(() => {
                    const rows = document.querySelectorAll('#signons-table tbody tr');
                    const row = rows[idx];
                    const input = row ? row.querySelector('input[type="datetime-local"]') : null;
                    if (input) {
                        input.focus();
                        try { input.showPicker(); } catch (e) {}
                    }
                }, 50);
            });
        },

        toLocalInput(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            // Format as YYYY-MM-DDTHH:MM for datetime-local input
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
        },

        async saveTime(idx, field, value) {
            this.editingId = null;
            this.editingField = null;
            if (!value) return;

            const s = this.signons[idx];
            const isoValue = new Date(value).toISOString();

            try {
                const resp = await fetch(`/admin/qr-signons/${s.id}/update`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ [field]: isoValue })
                });
                const data = await resp.json();
                if (data.success) {
                    this.signons[idx][field] = isoValue;
                    if (data.signon?.status) this.signons[idx].status = data.signon.status;
                    if (data.signon?.signoff_method) this.signons[idx].signoff_method = data.signon.signoff_method;
                    this.showToast('Time updated');
                } else {
                    this.showToast(data.error || 'Failed to update', 'error');
                }
            } catch (err) {
                this.showToast('Failed to update', 'error');
            }
        },

        exportCSV() {
            const headers = ['User', 'Site', 'Signed On', 'Signed Off', 'Status', 'Method'];
            const rows = this.signons.map(s => [
                s.user_name, s.site_name, s.signed_on_at, s.signed_off_at || '', s.status, s.signoff_method || ''
            ]);
            const csv = [headers, ...rows].map(r => r.map(c => `"${c}"`).join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sign-ons-${this.dateFrom}-to-${this.dateTo}.csv`;
            a.click();
        }
    };
}
</script>
{% endblock %}
